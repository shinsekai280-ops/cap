<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CAP</title>
<meta name="theme-color" content="#0E0F13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CAP">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<style>
/* App mobile une colonne : cartes sombres, ambre = actions, couleur = catégorie, nav fixe avec micro central */
:root{
  --bg:#0E0F13;--card:#1A1C23;--card2:#22252E;--line:#2A2D36;--fg:#F2F2F5;--mut:#8A8F9C;--dim:#5C6170;
  --amber:#F5B544;--amber-ink:#1A1306;--amber-soft:rgba(245,181,68,.12);--amber-glow:rgba(245,181,68,.35);
  --blue:#4C8DFF;--green:#3DD68C;--violet:#A78BFA;--orange:#FF8A4C;--red:#FF6B6B;
  --blue-soft:rgba(76,141,255,.14);--pink:#FF6FA8;--pink-soft:rgba(255,111,168,.14);--cyan:#3CC8E0;--cyan-soft:rgba(60,200,224,.14);--violet-soft2:rgba(167,139,250,.15);--amber2-soft:rgba(245,181,68,.14);--green-soft:rgba(61,214,140,.14);--violet-soft:rgba(167,139,250,.15);--orange-soft:rgba(255,138,76,.14);
  --navbg:rgba(14,15,19,.94);--scrim:rgba(5,6,8,.72);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:8px}
#app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(118px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
h1{font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-size:17px;font-weight:700;margin:0}
.eyebrow{font-size:13px;color:var(--mut)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.head-l{display:flex;flex-direction:column;gap:4px;min-width:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-h .count{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:52px}
.row:first-child{border-top:0}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t{font-size:15px;overflow-wrap:anywhere}
.row .s{font-size:12.5px;color:var(--mut)}
.done .t{color:var(--dim);text-decoration:line-through}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--dim);flex:none;display:grid;place-items:center;color:var(--amber-ink)}
.chk.on{background:var(--amber);border-color:var(--amber)}
.chk.g.on{background:var(--green);border-color:var(--green)}
.chk svg{width:14px;height:14px}
.ico{width:20px;height:20px;flex:none}
.ico-s{width:16px;height:16px;flex:none}
.iconbtn{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--fg)}
.x{width:30px;height:30px;display:grid;place-items:center;color:var(--dim);flex:none;border-radius:50%}
.x:hover{color:var(--red)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.p-blue{background:var(--blue-soft);color:var(--blue)}.p-green{background:var(--green-soft);color:var(--green)}
.p-violet{background:var(--violet-soft);color:var(--violet)}.p-orange{background:var(--orange-soft);color:var(--orange)}
.p-amber{background:var(--amber-soft);color:var(--amber)}.p-red{background:rgba(255,107,107,.14);color:var(--red)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:14px;background:var(--amber);color:var(--amber-ink);font-weight:700;font-size:15.5px;width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.btn.ghost{background:var(--card2);color:var(--fg);border:1px solid var(--line);font-weight:600}
.btn.sm{height:38px;font-size:14px;width:auto;padding:0 14px;border-radius:12px}
.btn-row{display:flex;gap:10px}.btn-row>*{flex:1}
.link{color:var(--amber);font-weight:600;font-size:14px}
.coach{border-color:rgba(245,181,68,.45);background:linear-gradient(180deg,rgba(245,181,68,.10),rgba(245,181,68,.03)),var(--card);display:flex;gap:12px;align-items:flex-start}
.coach .spark{color:var(--amber);flex:none;margin-top:1px}
.coach-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.coach-msg{font-size:15px;font-weight:600}
.coach-sub{font-size:13px;color:var(--mut)}
.prio{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;border-left:3px solid var(--c,var(--line))}
.num{width:26px;height:26px;border-radius:50%;background:var(--amber);color:var(--amber-ink);font-weight:800;font-size:13px;display:grid;place-items:center;flex:none}
.prio.done .num{background:var(--card2);color:var(--dim)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.mini .n{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .s{font-size:12px;color:var(--mut)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--amber))}
.pc{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:18px;padding:14px;text-align:left;width:100%}
.pc-top{display:flex;align-items:center;gap:12px}
.badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--cs);color:var(--c)}
.pc-name{font-weight:700;font-size:16px}
.pc-sub{font-size:12.5px;color:var(--mut)}
.pc-meta{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--mut);flex-wrap:wrap}
.pc-next{font-size:13.5px}.pc-next b{font-weight:600}
.pct{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.alert{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--amber);background:var(--amber-soft);border-radius:10px;padding:8px 10px}
.back{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:15px;align-self:flex-start;padding:4px 0}
.goal{display:flex;flex-direction:column;gap:10px}
.goal-l{font-size:12.5px;color:var(--mut)}
.goal-t{font-size:16px;font-weight:700}
.bul{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:4px 0}
.bul:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--amber);margin-top:8px;flex:none}
.bul span{flex:1;min-width:0;overflow-wrap:anywhere}
.addf{display:flex;gap:8px;align-items:center}
.inp{width:100%;min-width:0;height:44px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:15px}
.inp:focus{outline:none;border-color:var(--amber)}
textarea.inp{height:auto;min-height:110px;padding:12px;resize:vertical;line-height:1.45}
input[type=date].inp{width:150px;flex:none}
.tabs{display:flex;gap:6px}
.tabs button{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--mut);background:var(--card);border:1px solid var(--line)}
.tabs button.on{background:var(--amber-soft);color:var(--amber);border-color:rgba(245,181,68,.4)}
.steps{display:flex;flex-direction:column}
.step{display:flex;align-items:center;gap:12px;padding:9px 4px;text-align:left;width:100%;position:relative}
.step .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--dim);flex:none;display:grid;place-items:center;background:var(--bg);z-index:1}
.step.ok .dot{background:var(--c);border-color:var(--c);color:var(--bg)}
.step.cur .dot{border-color:var(--c);box-shadow:0 0 0 4px var(--cs)}
.step.cur .st{color:var(--c);font-weight:700}
.step .st{flex:1;min-width:0;font-size:14.5px}
.step.ok .st{color:var(--mut)}
.step:not(:last-child):after{content:"";position:absolute;left:14px;top:30px;bottom:-10px;width:2px;background:var(--line)}
.step .dot svg{width:12px;height:12px}
.cur-card{display:flex;gap:12px;align-items:center}
.ringwrap{display:flex;align-items:center;gap:16px}
.counter{display:flex;flex-direction:column;gap:12px}
.counter .big{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.counter .big small{font-size:16px;color:var(--mut);font-weight:600}
.cbtns{display:flex;gap:8px;flex-wrap:wrap}
.cbtns button{height:38px;padding:0 14px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums}
.log{display:flex;flex-direction:column;gap:3px;padding:10px 0;border-top:1px solid var(--line)}
.log:first-child{border-top:0;padding-top:0}
.log .d{font-size:12px;color:var(--mut)}
.log .x2{font-size:14px;overflow-wrap:anywhere}
.chat{display:flex;flex-direction:column;gap:10px}
.bub{max-width:86%;padding:10px 14px;border-radius:18px;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--amber);color:var(--amber-ink);border-bottom-right-radius:6px;font-weight:500}
.bub.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.bub.err{color:var(--mut)}
.lost{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px;border-radius:16px;background:var(--amber);color:var(--amber-ink);width:100%}
.lost b{font-size:16px;display:flex;align-items:center;gap:8px}
.lost span{font-size:12.5px;opacity:.75}
.sugg{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.sugg button{white-space:nowrap;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--fg)}
.chatform{position:sticky;bottom:calc(94px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end;background:var(--bg);padding-top:8px}
.chatform textarea{min-height:46px;height:46px;max-height:140px;border-radius:23px;padding:12px 16px;resize:none}
.send{width:46px;height:46px;border-radius:50%;background:var(--amber);color:var(--amber-ink);display:grid;place-items:center;flex:none}
.empty{color:var(--mut);font-size:14px;text-align:center;padding:18px 10px}
.pod{display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.thumb{width:52px;height:52px;border-radius:12px;flex:none;display:grid;place-items:center;color:var(--orange);background:linear-gradient(135deg,rgba(255,138,76,.35),rgba(255,138,76,.06));border:1px solid rgba(255,138,76,.3)}
.urlbox{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);background:var(--card2);border-radius:10px;padding:10px 12px;overflow:hidden}
.urlbox a{color:var(--fg);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.keys{display:flex;flex-direction:column;gap:8px;counter-reset:k}
.keys div{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.keys div:before{counter-increment:k;content:counter(k);width:22px;height:22px;border-radius:50%;background:var(--orange-soft);color:var(--orange);font-size:12px;font-weight:800;display:grid;place-items:center;flex:none}
.bilan-top{display:flex;align-items:center;gap:16px}
.mini-btns{display:flex;gap:6px;flex:none}
.mini-btns button{height:30px;padding:0 10px;border-radius:9px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--card2)}
.mini-btns button.a{border-color:rgba(245,181,68,.5);color:var(--amber);background:var(--amber-soft)}
.danger{color:var(--red);font-size:14px;font-weight:600;align-self:center;padding:10px}
.confirm{display:flex;flex-direction:column;gap:10px;align-items:stretch;border-color:rgba(255,107,107,.4)}
.btn.red{background:var(--red);color:#1B0606}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--navbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 80px 1fr 1fr;align-items:end}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mut);padding:6px 0;font-weight:500}
.tab.on{color:var(--amber)}
.mic{width:62px;height:62px;border-radius:50%;background:var(--amber);color:var(--amber-ink);margin:-28px auto 2px;display:grid;place-items:center;box-shadow:0 8px 26px var(--amber-glow),0 0 0 6px var(--bg)}
.mic svg{width:26px;height:26px}
/* sheet */
.sheet-bg{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);align-self:center}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet .inp{background:var(--bg)}
.hint{font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mut);background:var(--bg)}
.chips button.on{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
.prop{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:14px;padding:12px;text-align:left;width:100%}
.prop.off{opacity:.45}
.prop .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.prop .k{font-size:11.5px;color:var(--c);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.prop .t{font-size:14.5px;overflow-wrap:anywhere}
.prop .s{font-size:12.5px;color:var(--mut)}
.label{font-size:12.5px;color:var(--mut);font-weight:600}
.field{display:flex;flex-direction:column;gap:6px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;height:36px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--card2);color:var(--fg)}
.loading{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:14px}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--amber);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--card2);border:1px solid var(--line);color:var(--fg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.ring text{font-family:var(--font)}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.login{min-height:calc(100vh - 160px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.login .logo{width:72px;height:72px;border-radius:22px;background:var(--amber);color:var(--amber-ink);display:grid;place-items:center;box-shadow:0 10px 30px var(--amber-glow)}
.login .logo svg{width:36px;height:36px}
.sw{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--fg);transition:transform .2s}
.sw:checked{background:var(--green)}.sw:checked:after{transform:translateX(20px)}
.listen{display:flex;align-items:center;gap:14px;width:100%;padding:10px 12px;border-radius:16px;background:var(--bg);border:1px dashed var(--line);color:var(--mut);font-weight:600;text-align:left}
.listen .pulse{width:42px;height:42px;border-radius:50%;background:var(--amber);color:var(--amber-ink);display:grid;place-items:center;flex:none}
.listen .pulse svg{width:22px;height:22px}
.listen.on{border-color:var(--amber);color:var(--amber);border-style:solid;background:var(--amber-soft)}
.listen.on .pulse{animation:pl 1.3s ease-out infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 var(--amber-glow)}100%{box-shadow:0 0 0 16px rgba(245,181,68,0)}}
label.row{cursor:pointer}
.ico-xs{width:13px;height:13px;flex:none}
.time{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums;flex:none}
.streak{font-size:13px;font-weight:700;color:var(--amber);background:var(--amber-soft);padding:6px 10px;border-radius:999px;white-space:nowrap}
.sh{display:flex;align-items:center;gap:8px}
.sh svg{color:var(--amber)}
/* règle d'or */
.gold{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:20px;border:1.5px solid rgba(245,181,68,.55);background:linear-gradient(135deg,rgba(245,181,68,.16),rgba(245,181,68,.04)),var(--card)}
.gold-ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--amber-soft);color:var(--amber);border:1.5px solid rgba(245,181,68,.5)}
.gold.on .gold-ic{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.gold .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.gold .k,.evo .k{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--amber)}
.gold .pn{font-size:18px;font-weight:800}
.gold .s{font-size:13px;color:var(--mut)}
.gold.on .s{color:var(--green)}
/* projets */
.proj{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.proj-h{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;text-align:left;background:linear-gradient(90deg,var(--cs),transparent 70%)}
.dotc{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 4px var(--cs)}
.proj-h .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pn{font-weight:700;font-size:15.5px}
.proj-h .s{font-size:12px;color:var(--mut)}
.proj-h .count{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.proj-h svg{color:var(--dim)}
.plist .row{border-top:1px solid var(--line)}
.plist .chk.on{background:var(--c);border-color:var(--c)}
.qadd{padding:8px 10px;border-top:1px solid var(--line)}
.qadd .inp{height:40px;background:transparent;border-color:transparent;padding:0 6px}
.qadd .inp:focus{background:var(--card2);border-color:var(--line)}
.qadd .inp.tm{width:96px;flex:none;color:var(--mut)}
.qadd .iconbtn{width:34px;height:34px}
.inp.tm{width:110px;flex:none}
/* évoluer */
.evo{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:18px;padding:12px 14px}
.evo-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
.evo .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.evo .k{color:var(--c)}
.evo .s{font-size:12.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evo.done .pn{color:var(--dim);text-decoration:line-through}
.chk.g.on{background:var(--green);border-color:var(--green)}
/* semaine */
.wnav{display:flex;gap:8px}
.week{display:flex;flex-direction:column;gap:8px}
.wday{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;text-align:left;width:100%}
.wday.today{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.wday.past{opacity:.75}
.wd{display:flex;flex-direction:column;align-items:center;width:42px;flex:none}
.wdn{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.wdd{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.wday.today .wdn,.wday.today .wdd{color:var(--amber)}
.wbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.wtags{display:flex;gap:6px;flex-wrap:wrap}
.wbody .s{font-size:12.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wst{display:flex;align-items:center;gap:8px;flex:none}
.wsc{font-size:12.5px;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums}
.wcor{width:22px;height:22px;border-radius:50%;border:2px solid var(--amber);display:grid;place-items:center;color:var(--amber-ink)}
.wcor.on{background:var(--amber)}
.wrow{flex-wrap:wrap}
.wdl{width:90px;flex:none;font-weight:600}
.wsel{display:flex;gap:8px;flex:1;min-width:0}
.wsel select{flex:1;min-width:0;height:40px;padding:0 8px;font-size:14px}
.chips button[style*="--c"].on{border-color:var(--c);color:var(--c);background:transparent}
.swatch{width:34px;height:34px;border-radius:50% !important;background:var(--c) !important;border:3px solid var(--bg) !important;padding:0 !important}
.swatch.on{box-shadow:0 0 0 2px var(--fg)}
.lnk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut);text-decoration:none;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.prio .t{font-size:15px}

/* planning */
.calseg{margin-top:-4px}
.calbar{display:flex;align-items:center;gap:10px}
.callabel{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:16px;text-align:center}
.callabel .link{font-size:12.5px}
.addproj{border-style:dashed}
.rrow{width:100%;text-align:left}
.rt{font-size:13px;font-weight:800;color:var(--violet);font-variant-numeric:tabular-nums;width:52px;flex:none}
.rdvline{color:var(--violet)!important;display:flex;align-items:center;gap:4px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mh{text-align:center;font-size:11.5px;font-weight:700;color:var(--mut);padding-bottom:2px}
.mcell{aspect-ratio:1/1.15;max-width:100%;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding:5px 2px}
.mcell.out{opacity:.35}
.mcell.today{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber)}
.mcell .mn{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.mcell.cor .mn{background:var(--amber);color:var(--amber-ink)}
.mdots{display:flex;gap:3px;height:6px}
.mdots i,.lg{width:6px;height:6px;border-radius:50%;display:inline-block}
.dv{background:var(--violet)}.db{background:var(--blue)}.lg.cor{background:var(--amber)}
.mbar{width:70%;height:3px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:auto}
.mbar i{display:block;height:100%;background:var(--green)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.legend span{display:flex;align-items:center;gap:6px}
.ygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:360px){.ygrid{grid-template-columns:repeat(2,1fr)}}
.ymonth{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left}
.ymonth.now{border-color:var(--amber)}
.ymn{font-size:13px;font-weight:700}
.ydays{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.ydays i{aspect-ratio:1;border-radius:3px;background:var(--card2);display:block;position:relative}
.ydays i.o{background:transparent}
.ydays i.c{background:var(--amber)}
.ydays i.r:after{content:"";position:absolute;inset:auto 0 -1px 0;height:2px;background:var(--violet);border-radius:2px}
.ydays i.t{outline:1.5px solid var(--fg)}
.ys{font-size:11px;color:var(--mut)}
@media (prefers-reduced-motion:reduce){.listen.on .pulse{animation:none}}
</style>
